<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আইন-AI — বিজ্ঞপ্তি ও রিমাইন্ডার</title>
  <link rel="stylesheet" href="/static/fonts.css">
  <style>
    :root {
      --color-primary: #047857;
      --color-primary-dark: #065F46;
      --color-primary-soft: #ECFDF5;
      --color-bg: #F8FAFC;
      --color-surface: #FFFFFF;
      --color-border: #E2E8F0;
      --color-text-main: #0F172A;
      --color-text-muted: #64748B;
      --color-amber-bg: #FEF3C7;
      --color-amber-border: #F59E0B;
      --color-amber-text: #92400E;
      --color-danger-bg: #FEE2E2;
      --color-danger-border: #EF4444;
      --color-danger-text: #991B1B;
      --radius: 12px;
      --font-bn: 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-bn);
      background-color: var(--color-bg);
      color: var(--color-text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.6;
    }

    .app-layout {
      display: flex;
      flex: 1;
      width: 100%;
      min-width: 0;
    }

    /* Sidebar */
    .app-sidebar {
      width: 250px;
      background: #FFFFFF;
      border-right: 1px solid var(--color-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      color: var(--color-text-muted);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .nav-link:hover, .nav-link.active {
      background-color: var(--color-primary-soft);
      color: var(--color-primary);
    }

    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding-bottom: 80px;
    }

    /* Top bar */
    .top-bar {
      background: #FFFFFF;
      border-bottom: 1px solid var(--color-border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top-bar-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-primary);
    }
    .btn-trigger {
      background: var(--color-primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Control bar */
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 14px 18px;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      background: none;
      border: 1px solid var(--color-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      color: var(--color-text-muted);
    }
    .tab-btn.active {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }
    .settings-link {
      font-size: 13px;
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 600;
    }

    /* Notifications List */
    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .notif-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: all 0.15s ease;
      position: relative;
    }
    .notif-card.unread {
      border-left: 4px solid var(--color-primary);
      background: #F0FDF4;
    }
    .notif-icon {
      font-size: 22px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .notif-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .notif-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge-channel {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      background: #E2E8F0;
      color: #334155;
    }
    .badge-category {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      background: var(--color-primary-soft);
      color: var(--color-primary-dark);
    }
    .notif-time {
      font-size: 12px;
      color: var(--color-text-muted);
    }
    .notif-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text-main);
    }
    .notif-msg {
      font-size: 14px;
      color: var(--color-text-main);
      line-height: 1.5;
    }
    .btn-mark-read {
      background: none;
      border: 1px solid var(--color-border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--color-text-muted);
      align-self: flex-start;
      margin-top: 4px;
    }
    .btn-mark-read:hover {
      background: var(--color-primary-soft);
      color: var(--color-primary);
    }

    @media (max-width: 768px) {
      .app-sidebar { display: none; }
      .container { padding: 16px 12px; }
      .control-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
  <!-- Desktop Sidebar -->
  <aside class="app-sidebar" aria-label="প্রধান নেভিগেশন">
    <a href="/home" class="logo">
      <span aria-hidden="true">⚖️</span>
      <span>আইন-AI</span>
    </a>
    <ul class="nav-links">
      <li><a href="/home" class="nav-link">🏠 হোম</a></li>
      <li><a href="/cases" class="nav-link">📁 মামলা ফোল্ডার</a></li>
      <li><a href="/documents/upload" class="nav-link">📄 নোটিশ স্ক্যান</a></li>
      <li><a href="/notifications" class="nav-link active">🔔 বিজ্ঞপ্তি</a></li>
      <li><a href="/library" class="nav-link">📚 আইন পাঠাগার</a></li>
      <li><a href="/notification-settings" class="nav-link">⚙️ সেটিংস</a></li>
    </ul>
  </aside>

  <!-- Main Area -->
  <main class="app-main">
    <header class="top-bar">
      <h1 class="top-bar-title">বিজ্ঞপ্তি ও রিমাইন্ডার</h1>
      <button type="button" class="btn-trigger" id="btnTriggerNotifications" onclick="triggerNotifications()">
        🔄 রিমাইন্ডার চেক করুন
      </button>
    </header>

    <div class="container">

      <!-- Control Bar -->
      <section class="control-bar">
        <div class="filter-tabs">
          <button type="button" class="tab-btn active" data-filter="all" onclick="setNotifFilter('all', this)">সকল বিজ্ঞপ্তি</button>
          <button type="button" class="tab-btn" data-filter="unread" onclick="setNotifFilter('unread', this)">অপঠিত</button>
        </div>
        <a href="/notification-settings" class="settings-link">⚙️ বিজ্ঞপ্তি সেটিংস পরিবর্তন করুন →</a>
      </section>

      <!-- Notifications List -->
      <section class="notif-list" id="notifList">
        <!-- Rendered dynamically -->
      </section>

    </div>
  </main>
  </div>

  <script>
    let notifications = [];
    let currentFilter = 'all';

    function getMockNotifications() {
      return [
        {
          id: 'notif-1',
          title: 'আসন্ন সময়সীমা রিমাইন্ডার (৩ দিন পূর্বে)',
          message: 'আপনার আইনি নোটিশের জবাব দাখিলের আর ৩ দিন বাকি রয়েছে। ১৬ অক্টোবর ২০২৬ এর মধ্যে জবাব প্রেরণ নিশ্চিত করুন।',
          channel: 'in_app',
          category: 'deadline_reminder',
          status: 'pending',
          created_at: 'আজ সকাল ০৮:০০'
        },
        {
          id: 'notif-2',
          title: 'দৈনিক সারাংশ (ডাইজেস্ট)',
          message: 'আজকের কার্যতালিকা: ১টি মামলার জবাব প্রস্তুতি ও ১টি জমির দলিল উত্তোলন সংক্রান্ত সময়সীমা আসন্ন।',
          channel: 'in_app',
          category: 'daily_digest',
          status: 'sent',
          created_at: 'গতকাল সকাল ০৮:০০'
        },
        {
          id: 'notif-3',
          title: 'এসএমএস সতর্কবার্তা পাঠানো হয়েছে',
          message: 'নিরাপদ এসএমএস সতর্কবার্তা প্রেরণ করা হয়েছে: "আপনার একটি আইনি সময়সীমা আসন্ন। বিস্তারিত দেখতে আইন-এআই খুলুন।"',
          channel: 'sms',
          category: 'deadline_reminder',
          status: 'delivered',
          created_at: '০২ অক্টোবর ২০২৬'
        }
      ];
    }

    async function loadNotifications() {
      const urlParams = new URLSearchParams(window.location.search);

      if (urlParams.get('filter') === 'empty') {
        notifications = [];
        renderNotifications(notifications);
        return;
      }

      if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http') || urlParams.has('mock')) {
        notifications = getMockNotifications();
        renderNotifications(notifications);
        return;
      }

      try {
        const token = localStorage.getItem('ain_token');
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        const res = await fetch('/api/v1/notifications', { headers });
        if (!res.ok) throw new Error('বিজ্ঞপ্তি তালিকা পাওয়া যায়নি');
        const data = await res.json();
        notifications = data.notifications || [];
        renderNotifications(notifications);
      } catch (err) {
        console.warn('Fallback to mock notifications:', err);
        notifications = getMockNotifications();
        renderNotifications(notifications);
      }
    }

    function formatTimeBn(raw) {
      if (!raw) return 'সম্প্রতি';
      if (typeof raw === 'string' && (raw.includes('আজ') || raw.includes('গতকাল') || raw.includes('সম্প্রতি'))) {
        return raw;
      }
      try {
        const d = new Date(raw);
        if (isNaN(d.getTime())) return 'সম্প্রতি';
        const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
        const toBn = n => String(n).replace(/[0-9]/g, x => bnDigits[Number(x)]);
        const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
        return `${toBn(d.getDate())} ${months[d.getMonth()]} ${toBn(d.getFullYear())}`;
      } catch (e) {
        return 'সম্প্রতি';
      }
    }

    function renderNotifications(list) {
      const container = document.getElementById('notifList');
      container.innerHTML = '';

      const filtered = list.filter(n => {
        if (currentFilter === 'unread') return n.status === 'pending' || n.status === 'unread';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius); padding:40px; text-align:center; color:var(--color-text-muted);">কোনো নতুন বিজ্ঞপ্তি নেই।</div>';
        return;
      }

      filtered.forEach(n => {
        const isUnread = n.status === 'pending' || n.status === 'unread';
        const card = document.createElement('div');
        card.className = 'notif-card' + (isUnread ? ' unread' : '');
        card.innerHTML = `
          <div class="notif-icon">${n.channel === 'sms' ? '📱' : '🔔'}</div>
          <div class="notif-body">
            <div class="notif-header">
              <div style="display:flex; gap:6px; align-items:center;">
                <span class="badge-channel">${n.channel === 'sms' ? 'এসএমএস' : 'ইন-অ্যাপ'}</span>
                <span class="badge-category">${n.category === 'daily_digest' ? 'দৈনিক ডাইজেস্ট' : 'সময়সীমা রিমাইন্ডার'}</span>
              </div>
              <span class="notif-time">${formatTimeBn(n.created_at)}</span>
            </div>
            <div class="notif-title">${n.title}</div>
            <div class="notif-msg">${n.message}</div>
            ${isUnread ? `<button type="button" class="btn-mark-read" onclick="markRead('${n.id}', this)">পড়া হয়েছে</button>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setNotifFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderNotifications(notifications);
    }

    function markRead(id, btn) {
      const item = notifications.find(n => n.id === id);
      if (item) item.status = 'read';
      renderNotifications(notifications);
    }

    async function triggerNotifications() {
      const btn = document.getElementById('btnTriggerNotifications');
      btn.disabled = true;
      btn.innerText = 'চেক করা হচ্ছে...';

      if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http')) {
        setTimeout(() => {
          btn.disabled = false;
          btn.innerText = '🔄 রিমাইন্ডার চেক করুন';
          alert('রিমাইন্ডার শিডিউলার পরীক্ষা সম্পন্ন হয়েছে। নতুন কোনো বকেয়া রিমাইন্ডার নেই।');
        }, 500);
        return;
      }

      try {
        const res = await fetch('/api/v1/notifications/trigger', { method: 'POST' });
        const data = await res.json();
        alert('রিমাইন্ডার ইঞ্জিন সফলভাবে চালিত হয়েছে: ' + JSON.stringify(data.result));
        loadNotifications();
      } catch (err) {
        alert('ট্রিগার ব্যর্থ: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '🔄 রিমাইন্ডার চেক করুন';
      }
    }

    window.addEventListener('DOMContentLoaded', loadNotifications);
  </script>
  <div class="build-stamp" id="buildStamp" style="font-size:11px; color:#94a3b8; text-align:center; padding:12px 0;">build: 2026.10.08-s9-hardening</div>
  <script src="/static/sw-register.js"></script>
</body>
</html>
