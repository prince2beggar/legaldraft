[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "apps/web/node_modules",
    "packages/ui_kit/node_modules",
    "backend",  # Legacy pre-existing code preserved
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests/s0"]
pythonpath = ["."]
