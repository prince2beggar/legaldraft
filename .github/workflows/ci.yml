name: AIN-AI Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Type Check & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest anyio pydantic fastapi beautifulsoup4 alembic sqlalchemy

      - name: 1. Code Linting (Ruff)
        run: python -m ruff check .

      - name: 2. Static Type Checking (Mypy)
        run: python -m mypy packages services --explicit-package-bases --ignore-missing-imports

      - name: 3. Test Suite & Reversible Migrations (Pytest)
        run: python -m pytest tests/s0 -v --tb=short
